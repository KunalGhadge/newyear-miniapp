<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>For Gayatri ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Great+Vibes&family=Fredoka:wght@300;400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #050505;
        overflow: hidden;
        touch-action: none; /* Disables double-tap zoom */
        color: #fff;
        user-select: none; /* Prevents text selection on long press */
        -webkit-user-select: none;
      }
      .font-hand { font-family: 'Dancing Script', cursive; }
      .font-cursive { font-family: 'Great Vibes', cursive; }
      .font-serif { font-family: 'Playfair Display', serif; }
      .font-cute { font-family: 'Fredoka', sans-serif; }
      .font-pen { font-family: 'Patrick Hand', cursive; }
      
      /* Premium Gold Gradient */
      .text-gold {
        background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% auto;
        animation: shine 4s linear infinite;
      }

      @keyframes shine {
        to { background-position: 200% center; }
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(219, 39, 119, 0.3);
        border-radius: 20px;
      }
      
      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
    </style>

{

    "framer-motion": "https://esm.sh/framer-motion@^12.23.26"
  }
}
</script>
</head>

  </body>
</html>
